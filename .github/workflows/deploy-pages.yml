# 部署 GitHub Pages（官方模板：actions/deploy-pages）。
# 前置：Settings → Pages → Source 要選「Build and deployment using GitHub Actions」，
# 否則本 workflow 的部署會被 branch 部署模式擋下。
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # 允許在 Actions 頁面手動觸發
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
