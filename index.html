<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="site.title">Apple Cards — One Prompt, Many Models</title>
  <meta name="description" data-i18n="meta.description"
        content="One prompt about the benefits of eating apples, answered by many models — each answer is an HTML card in the orchard-notebook style.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
  <link rel="stylesheet" href="style.css">
  <!-- Set the theme before first paint so there is no flash of the wrong theme. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">
        <span aria-hidden="true">🍎</span>
        <span data-i18n="site.title">Apple Cards</span>
      </a>
      <div class="controls">
        <label class="lang-label">
          <span class="sr-only" data-i18n="lang.label">Language</span>
          <select id="langSelect" aria-label="Language"></select>
        </label>
        <button id="themeToggle" class="theme-toggle" type="button">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="intro">
      <h1 data-i18n="hero.title">One prompt, many models.</h1>
      <p data-i18n="hero.tagline">
        Every model below received the exact same task: build an HTML card about the benefits
        of eating apples, styled like a torn-out page from an orchard notebook.
      </p>
      <details class="prompt">
        <summary data-i18n="prompt.summary">The prompt</summary>
        <p data-i18n="prompt.text"></p>
      </details>
    </section>

    <nav class="filters" id="filters" aria-label="Filter by model family"></nav>

    <div class="compare-bar" id="compareBar" hidden>
      <span class="compare-count" id="compareCount"></span>
      <button class="btn" id="compareBtn" type="button" data-i18n="compare.button">Compare side by side</button>
      <button class="btn ghost" id="compareClear" type="button" data-i18n="compare.clear">Clear</button>
      <button class="btn ghost" id="compareBack" type="button" data-i18n="compare.back">← Back to all cards</button>
    </div>

    <section class="grid" id="grid" aria-label="Model cards"></section>
    <div class="grid-foot" id="gridFoot"></div>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer.note">All cards are self-contained HTML with inline CSS — no external dependencies.</p>
  </footer>

  <script src="i18n.js"></script>
  <script src="models.js"></script>
  <script src="main.js"></script>
</body>
</html>
