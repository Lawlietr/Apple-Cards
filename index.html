<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="site.title">Apple Cards — One Prompt, Many Models</title>
  <meta name="description" data-i18n="meta.description"
        content="One prompt about the benefits of eating apples, answered by many models — each answer is an HTML card in the orchard-notebook style.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍎</text></svg>">
  <link rel="stylesheet" href="style.css">
  <!-- Language strings are loaded here rather than at </body> like the other
       scripts, so the pre-paint pass below can resolve the visitor's language.
       i18n.js is pure data plus detectLang(); it touches no DOM, so loading it
       in <head> is safe. -->
  <script src="i18n.js"></script>
  <!-- Set the theme AND <html lang> before first paint, so there is no flash
       of the wrong theme and the document language is correct for screen
       readers, font selection and hyphenation from the very first render.
       Translated text itself is still applied by main.js — only the language
       attribute is moved earlier. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
      document.documentElement.setAttribute("lang", detectLang());
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./">
        <span aria-hidden="true">🍎</span>
        <span data-i18n="site.title">Apple Cards</span>
      </a>
      <div class="controls">
        <!-- An icon button, but the widget underneath is a real <select>:
             keyboard support and mobile native pickers come free. The globe and
             the language-code badge are decoration painted under the (invisible,
             full-size) select, and the badge shows the CURRENT language on
             purpose — a bare globe icon would hide which one is active.
             No hardcoded aria-label here: the sr-only text below is translated,
             and a hardcoded label would override it for screen readers.
             Order in this row is deliberate: language first (it changes the page
             you are looking at), then the repository link, then the theme. -->
        <label class="lang-switch" id="langSwitch">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3.4 9h17.2M3.4 15h17.2M12 3a14.5 14.5 0 0 1 0 18M12 3a14.5 14.5 0 0 0 0 18"/>
          </svg>
          <span class="lang-badge" id="langBadge" aria-hidden="true">EN</span>
          <span class="sr-only" data-i18n="lang.label">Language</span>
          <select id="langSelect"></select>
        </label>
        <a class="github-link" href="https://github.com/Lawlietr/Apple-Cards" target="_blank" rel="noopener" aria-label="GitHub repository" title="GitHub repository">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
          </svg>
        </a>
        <button id="themeToggle" class="theme-toggle" type="button">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/>
          </svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Model navigation"></aside>
  <main class="page">
    <section class="intro">
      <h1 data-i18n="hero.title">One prompt, many models.</h1>
      <p data-i18n="hero.tagline">
        Every model below received the exact same task: build an HTML card about the benefits
        of eating apples, styled like a torn-out page from an orchard notebook.
      </p>
      <details class="prompt">
        <summary data-i18n="prompt.summary">The prompt</summary>
        <p data-i18n="prompt.text"></p>
        <p class="prompt-note" data-i18n="prompt.note"></p>
      </details>
    </section>

    <nav class="filters" id="filters" aria-label="Filter by model family"></nav>

    <div class="compare-bar" id="compareBar" hidden>
      <span class="compare-count" id="compareCount"></span>
      <button class="btn" id="compareBtn" type="button" data-i18n="compare.button">Compare side by side</button>
      <button class="btn ghost" id="compareClear" type="button" data-i18n="compare.clear">Clear</button>
      <button class="btn ghost" id="compareBack" type="button" data-i18n="compare.back">← Back to all cards</button>
    </div>

    <section class="grid" id="grid" aria-label="Model cards"></section>
    <div class="grid-foot" id="gridFoot"></div>
  </main>
  </div>

  <footer class="site-footer">
    <p data-i18n="footer.note">All cards are self-contained HTML with inline CSS — no external dependencies.</p>
  </footer>

  <script src="models.js"></script>
  <script src="main.js"></script>
</body>
</html>
